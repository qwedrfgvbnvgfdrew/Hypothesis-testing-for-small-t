<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hypothesis Testing Flashcards · NYC Winter</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fg:#f4f8ff;--glass:rgba(12,22,48,.62);--glassb:rgba(40,60,110,.66);--acc:#9fd8ff;--mut:#b9c7e0;--bd:rgba(255,255,255,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1530;color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;padding:16px;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s;z-index:-3;transform:scale(1.05);animation:kb 24s ease-in-out infinite alternate}
.bg.on{opacity:1}
@keyframes kb{to{transform:scale(1.15) translate(-1%,-1%)}}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,10,30,.55),rgba(5,10,30,.25) 50%,rgba(5,10,30,.6));z-index:-2}
#snow{position:fixed;inset:0;z-index:-1;pointer-events:none}
h1{font-size:clamp(26px,6vw,44px);margin:6px 0 2px;text-align:center;letter-spacing:.02em;font-weight:700}
h1 span{display:inline-block;animation:bob 3s ease-in-out infinite,glow 4s ease-in-out infinite;white-space:pre}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{color:#fff;text-shadow:0 0 6px rgba(159,216,255,.4)}50%{color:#bfe6ff;text-shadow:0 0 16px #9fd8ff,0 0 30px #5fb4ff}}
.sub{color:var(--mut);font-size:15px;margin-bottom:12px;font-style:italic;text-shadow:0 1px 4px #000}
.bar{width:100%;max-width:720px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9fd8ff,#fff);width:0;transition:width .3s}
.card{width:100%;max-width:720px;min-height:440px;margin:14px 0;perspective:1000px;cursor:pointer}
.in{position:relative;width:100%;min-height:440px;transition:transform .6s;transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:safe center;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.face.b{transform:rotateY(180deg);background:var(--glassb)}
.tag{position:absolute;top:12px;left:16px;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.12em;font-family:system-ui,sans-serif}
.txt{font-size:clamp(25px,5.4vw,34px);line-height:1.5;white-space:pre-line}
.b .txt{font-size:clamp(21px,4.4vw,27px)}.b .txt.long{font-size:clamp(17px,3.6vw,21px)}
.txt span{display:inline-block;white-space:pre;opacity:0;animation:drop .6s forwards}
.txt span.sp{display:inline}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(1.3);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.hint{position:absolute;bottom:10px;right:14px;font-size:13px;color:var(--mut);font-family:system-ui,sans-serif}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-family:system-ui,sans-serif;font-size:16px;padding:11px 20px;border-radius:999px;border:1px solid var(--bd);background:rgba(12,22,48,.55);color:var(--fg);cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button:hover{background:rgba(159,216,255,.25)}
button.p{background:#9fd8ff;color:#0b1530;border-color:#9fd8ff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px;margin-top:12px}.chips button{padding:6px 11px;font-size:14px;border-radius:8px}.chips button.cur{background:#9fd8ff;color:#0b1530}.cl{color:var(--mut);font-size:13px;margin-top:14px;font-family:system-ui,sans-serif;text-align:center}.cnt{color:var(--mut);font-size:13px;margin-top:10px;font-family:system-ui,sans-serif;text-shadow:0 1px 4px #000}
@media (prefers-reduced-motion:reduce){h1 span,.bg{animation:none}.txt span{animation-duration:.01s}}
</style></head><body>
<div id="bgs"></div><div class="shade"></div><canvas id="snow"></canvas>
<h1 id="ti">Statistical Inference: Hypothesis Testing</h1>
<div class="sub">❄ New York in winter · every slide of both decks covered</div>

<div class="bar"><i id="pg"></i></div>
<div class="card" id="c" onclick="flip()"><div class="in">
<div class="face"><span class="tag" id="ft"></span><div class="txt" id="q"></div><span class="hint">tap to flip</span></div>
<div class="face b"><span class="tag" id="bt"></span><div class="txt" id="a"></div></div>
</div></div>
<div class="ctl"><button onclick="go(-1)">← Prev</button><button class="p" onclick="flip()">Flip</button><button onclick="go(1)">Next →</button><button onclick="shuf()">Shuffle</button><button onclick="reset()">Reset order</button></div>
<div class="cnt" id="n"></div>
<div class="cl">Slide checklist for this part: tap a number to jump to its first card (every slide has at least one)</div><div class="chips" id="ch"></div>

const D1=[
["Slide 1","What is the topic of this deck?","Statistical Inference: Hypothesis Testing (Statistical Techniques for Business)."],
["Slide 2","When we sample a population, what two things might we want to do?","1) Calculate estimates of the true population parameters (e.g. sample mean for μ).\n2) Assess the probable truth or falsity of a statement about a parameter, known as a hypothesis."],
["Slide 2","Which sample quantities estimate the population parameters μx and σx²?","The sample mean x̄ estimates μx, and the sample variance sx² estimates σx²."],
["Slide 2","Give examples of hypotheses.","• The average height of the population of Tashkent is at least 5’9” (μ ≥ 5’9”).\n• The average weekly salary of computer programmers is $800 (μ = 800)."],
["Slide 3","What are we trying to assess in hypothesis testing?","Whether the statistical evidence is consistent with the statement being true, or tends to suggest the statement is false."],
["Slide 3","Define the null hypothesis (H0).","A statement about a population parameter (or parameters) whose probable truth (or falsity) we wish to investigate."],
["Slide 3","Define the alternative hypothesis (H1).","An alternative statement, which is true if H0 is false."],
["Slide 4","Simple vs composite hypothesis?","Simple: specifies a single value for the parameter.\nComposite: specifies a range of values."],
["Slide 4","Classify: (a) H0: μ = 10 vs H1: μ ≠ 10 and (b) H0: μ ≥ 10 vs H1: μ < 10.","(a) H0 is simple, H1 is composite.\n(b) H0 and H1 are both composite."],
["Slide 5","When is H1 one-sided? What test does it need?","When it specifies a range of values all on one side of the value(s) in H0 (e.g. H1: μ < 10).\nIt requires a one-tail test."],
["Slide 5","When is H1 two-sided? What test does it need?","When it specifies values on either side of the value(s) in H0 (e.g. H1: μ ≠ 10).\nIt requires a two-tail test."],
["Slide 5","What is a test statistic?","A random variable whose probability distribution, if H0 is true, is known."],
["Slide 5","What is a decision rule?","A procedure for deciding whether to accept or reject H0, based on the realised value of the test statistic. It compares the test statistic with a ‘critical value’ from the statistic’s distribution when H0 is true."],
["Slide 5","What is the significance level of a test?","The probability of incorrectly rejecting a null hypothesis that is actually true."],
["Slide 6","When is the significance level set, and what size is chosen?","Usually set by the statistician before carrying out the test, and usually a relatively small value."],
["Slide 6","What does a 0.05 significance level mean?","A one-in-twenty chance of making the wrong decision by rejecting a null hypothesis that is actually true."],
["Slide 6","What is the default significance level?","0.05. It is used always unless stated otherwise."],
["Slide 6","Other significance levels and their meaning?","Higher: 0.1 (one-in-ten chance of a wrong decision).\nLower: 0.01 (one-in-one-hundred chance of a wrong decision)."],
["Slide 7","Right-tail test (σ² known): which hypotheses?","H0: μ = μ0 vs H1: μ > μ0\n[or H0: μ ≤ μ0 vs H1: μ > μ0]"],
["Slide 7","Test statistic for a mean when population variance σ² is known?","z = (x̄ − μ0) / (σx / √n)\n~ N(0,1) if H0 is true."],
["Slide 8","Right-tail test: probabilities if H0 is true, and the critical value?","P(z ≤ z0.05) = 0.95\nP(z > z0.05) = 0.05\nz should be less than z0.05. From tables, z0.05 = 1.645."],
["Slide 8–9","Right-tail test: decision rule?","Accept H0 if zcal ≤ z0.05\nReject H0 if zcal > z0.05\n(Diagram, slide 9: normal curve with the rejection region in the right tail beyond z0.05 = 1.645.)"],
["Slide 10","Left-tail test (σ² known): which hypotheses and statistic?","H0: μ = μ0 vs H1: μ < μ0\n[or H0: μ ≥ μ0 vs H1: μ < μ0]\nz = (x̄ − μ0)/(σx/√n) ~ N(0,1) if H0 is true."],
["Slide 11","Left-tail test: probabilities if H0 is true, and the critical value?","P(z ≥ −z0.05) = 0.95\nP(z < −z0.05) = 0.05\nz should be greater than −z0.05. From tables, −z0.05 = −1.645."],
["Slide 11–12","Left-tail test: decision rule?","Accept H0 if z ≥ −z0.05\nReject H0 if z < −z0.05\n(Diagram, slide 12: rejection region in the left tail below −1.645.)"],
["Slide 13","Two-tail test (σ² known): hypotheses and statistic?","H0: μ = μ0 vs H1: μ ≠ μ0\nz = (x̄ − μ0)/(σx/√n) ~ N(0,1) if H0 is true."],
["Slide 14","Two-tail test: probabilities if H0 is true, and the critical value?","P(−z0.025 ≤ z ≤ z0.025) = 0.95\nP(z < −z0.025 or z > z0.025) = 0.05\nFrom tables, ±z0.025 = ±1.96."],
["Slide 14–15","Two-tail test: decision rule?","Accept H0 if −z0.025 ≤ z ≤ z0.025\nReject H0 if z < −z0.025 or z > z0.025\n(Diagram, slide 15: rejection regions in both tails, beyond ±1.96.)"],
["Slide 16","Two-tail test when σ² is unknown: statistic and rule?","z = (x̄ − μ0)/(sx/√n) ~ N(0,1) if H0 is true.\nAccept H0 if −z0.025 ≤ z ≤ z0.025; reject if z < −z0.025 or z > z0.025.\nThe one-tail structure is the same as before."],
["Slide 17","What changes when σ² is unknown?","Replace the unknown population standard deviation σx with the sample standard deviation sx."],
["Slide 17","Large sample vs small sample when σ² is unknown?","Large sample: the test statistic is still N(0,1).\nSmall sample: its distribution changes to t(n−1)."],
["Slides 8, 11, 14","SUMMARY: critical values and rejection rules at the 5% level?","Right-tail (H1: μ > μ0): z0.05 = 1.645; reject if z > 1.645.\nLeft-tail (H1: μ < μ0): −z0.05 = −1.645; reject if z < −1.645.\nTwo-tail (H1: μ ≠ μ0): ±z0.025 = ±1.96; reject if z < −1.96 or z > 1.96."],
["Slide 18","Exercise set-up?","75 randomly chosen students: x̄ = 58, sample variance sx² = 115. Test at the 5% level:\n(i) H0: μ ≤ 55 vs H1: μ > 55, σ² = 98\n(ii) H0: μ ≥ 60 vs H1: μ < 60, σ² = 98\n(iii) H0: μ = 60 vs H1: μ ≠ 60, σ² = 98\n(iv) H0: μ ≥ 60 vs H1: μ < 60, σ² unknown"],
["Slide 19","Solve (i): H0: μ ≤ 55 vs H1: μ > 55, σ² = 98.","z = (58 − 55)/√(98/75) = 2.62\nRule: reject if z > z0.05 = 1.645.\n2.62 > 1.645 → reject H0."],
["Slide 20","Solve (ii): H0: μ ≥ 60 vs H1: μ < 60, σ² = 98.","z = (58 − 60)/√(98/75) = −1.75\nRule: reject if z < −z0.05 = −1.645.\n−1.75 < −1.645 → reject H0."],
["Slide 21","Solve (iii): H0: μ = 60 vs H1: μ ≠ 60, σ² = 98.","z = (58 − 60)/√(98/75) = −1.75\nRule: accept if −1.96 ≤ z ≤ 1.96.\n−1.75 is inside → accept H0."],
["Slide 22","Solve (iv): H0: μ ≥ 60 vs H1: μ < 60, σ² unknown.","Use sx² = 115: z = (58 − 60)/√(115/75) = −1.62\nRule: accept if z ≥ −z0.05 = −1.645.\n−1.62 ≥ −1.645 → accept H0."],
["Slides 20 & 22","Why do (ii) and (iv) give different decisions?","Same test, but (ii) uses σ² = 98 (z = −1.75, reject) while (iv) uses the sample variance 115 (z = −1.62, accept). The larger variance gives a smaller |z|, which falls just inside the acceptance region."],
["Slide 23","What are the recommended readings?","Newbold, P., Carlson, W.L. and Thorne, B. (2013). Statistics for Business and Economics, 8th ed. Harlow: Pearson. Chapters 9, 10."]
];
